<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Şifa Hanım Aktar — Şifalı Bitki Kütüphanesi</title>
    <meta
      name="description"
      content="Şifa Hanım Aktar bitki kütüphanesi: şifalı bitkiler, tıbbi ve aromatik otlar. Ne işe yarar, nasıl kullanılır, nelere dikkat edilir — aktar rehberi."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="tr_TR" />
    <meta property="og:site_name" content="Şifa Hanım Aktar" />
    <meta property="og:image" content="https://sifahanimaktar.vercel.app/icon-512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#8D7B68" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      /* React yüklenene kadar boş beyaz ekran yerine marka rengi + mesaj */
      #boot-screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        padding: 1.5rem;
        background: #fdfbf7;
        color: #4a3e3d;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      #boot-screen strong {
        font-size: 1.125rem;
        font-weight: 600;
      }
      #boot-screen span {
        font-size: 0.9375rem;
        opacity: 0.75;
      }
      .boot-spinner {
        width: 2.25rem;
        height: 2.25rem;
        border: 3px solid #e8dfd3;
        border-top-color: #8d7b68;
        border-radius: 50%;
        animation: boot-spin 0.85s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:ital,wght@0,500;0,600;0,700;1,500&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:ital,wght@0,500;0,600;0,700;1,500&display=swap"
      />
    </noscript>
  </head>
  <body>
    <a class="skip-link" href="#main-content">İçeriğe atla</a>
    <!-- Netlify Forms: bulunamayan aramalar (JS ile gönderilir) -->
    <form name="missing-searches" netlify netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="arama" />
      <input name="tarih" />
    </form>
    <div id="root">
      <div id="boot-screen" aria-live="polite" aria-busy="true">
        <div class="boot-spinner" aria-hidden="true"></div>
        <strong>Şifa Hanım Aktar</strong>
        <span>Bitki kütüphanesi yükleniyor…</span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
