# Netlify: React vitrini. Build client/ içinden çalışır.
[build]
  base = "client"
  command = "npm install && node scripts/prepare-public.mjs && node scripts/generate-sitemap.mjs && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  SITE_URL = "https://sifahanimaktar.netlify.app"

# Google Search Console doğrulama dosyası SPA yedeğine düşmesin.
[[redirects]]
  from = "/google8a881356b5a15b66.html"
  to = "/google8a881356b5a15b66.html"
  status = 200
  force = false

# /api Express'i Netlify'de yok. 200 + HTML dönmesin; aksi halde detay sayfası çöker.
[[redirects]]
  from = "/api/*"
  to = "/index.html"
  status = 404

# SPA: uzantılı dosyalar (css/js/png) HTML'e dönmesin — eski önbellek bozulmasın
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/data/*"
  to = "/data/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
