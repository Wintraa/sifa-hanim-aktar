<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profilim | Doğal Bitkiler Ansiklopedisi</title>
    <meta
      name="description"
      content="Doğal Bitkiler Ansiklopedisi profilinizi görüntüleyin ve güncelleyin; ad, iletişim ve biyografi bilgilerinizi yönetin."
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="author" content="Doğal Bitkiler Ansiklopedisi" />
    <meta name="theme-color" content="#8D7B68" />
    <meta name="color-scheme" content="light" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="tr_TR" />
    <meta property="og:site_name" content="Doğal Bitkiler Ansiklopedisi" />
    <meta property="og:title" content="Profilim | Doğal Bitkiler Ansiklopedisi" />
    <meta
      property="og:description"
      content="Doğal Bitkiler Ansiklopedisi profilinizi görüntüleyin ve güncelleyin; ad, iletişim ve biyografi bilgilerinizi yönetin."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:ital,wght@0,500;0,600;0,700;1,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/layout.css" />
    <link rel="stylesheet" href="styles/components.css" />
    <link rel="stylesheet" href="styles/pages.css" />
    <link rel="stylesheet" href="styles/responsive.css" />
  </head>
  <body class="profile-body">
    <a class="skip-link" href="#main-content">İçeriğe atla</a>

    <noscript>
      <p class="noscript-notice">
        Profil bilgileri JavaScript ile yüklenir ve kaydedilir. Lütfen JavaScript’i etkinleştirin.
      </p>
    </noscript>

    <header class="detail-header">
      <a class="back-button" href="index.html">Ana Sayfaya Dön</a>
      <div>
        <p class="section-label">Hesap</p>
        <h1 id="profilePageTitle">Profilim</h1>
      </div>
    </header>

    <main class="profile-main" id="main-content">
      <section class="profile-layout">
        <article class="profile-card profile-card--summary" aria-labelledby="summaryFullName">
          <div class="profile-avatar-block">
            <img
              id="profileAvatarPreview"
              class="profile-avatar"
              src=""
              alt="Profil fotoğrafı"
              width="320"
              height="320"
              decoding="async"
            />
            <div class="profile-avatar-actions">
              <label class="back-button profile-secondary-button" for="profileAvatarInput">
                Fotoğrafı Değiştir
              </label>
              <input
                id="profileAvatarInput"
                class="profile-file-input"
                type="file"
                accept="image/jpeg,image/png,image/webp"
                aria-describedby="avatarFeedback"
              />
              <button id="removeAvatarButton" class="profile-tertiary-button" type="button">
                Fotoğrafı Kaldır
              </button>
            </div>
            <p id="avatarFeedback" class="profile-feedback" aria-live="polite" role="status"></p>
          </div>

          <div class="profile-summary-content">
            <p class="section-label">Genel Bilgiler</p>
            <h2 id="summaryFullName">Yükleniyor...</h2>
            <p id="summaryTitle" class="profile-summary-title"></p>
            <p id="summaryBio" class="detail-description"></p>

            <div class="completion-block" aria-labelledby="completionLabel">
              <div class="completion-block__header">
                <span id="completionLabel">Profil tamamlanma</span>
                <strong id="completionPercent">0%</strong>
              </div>
              <div
                class="completion-bar"
                role="progressbar"
                aria-labelledby="completionLabel"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-valuenow="0"
                id="completionBar"
              >
                <span id="completionFill"></span>
              </div>
              <p id="completionHint" class="completion-hint"></p>
            </div>

            <dl class="profile-meta-list">
              <div>
                <dt>Kullanıcı Adı</dt>
                <dd id="summaryUsername"></dd>
              </div>
              <div>
                <dt>E-posta</dt>
                <dd id="summaryEmail"></dd>
              </div>
              <div>
                <dt>Katılım Tarihi</dt>
                <dd id="summaryJoinDate"></dd>
              </div>
            </dl>
          </div>
        </article>

        <article class="profile-card" aria-labelledby="profileEditHeading">
          <div class="profile-card__header">
            <div>
              <p class="section-label">Profil</p>
              <h2 id="profileEditHeading">Bilgilerini görüntüle ve güncelle</h2>
            </div>
            <button id="toggleEditButton" class="back-button profile-secondary-button" type="button">
              Düzenleme Modunu Aç
            </button>
          </div>

          <div id="profileInfoView" class="profile-info-view">
            <div class="profile-info-grid">
              <article class="profile-info-item">
                <h3>Ad Soyad</h3>
                <p id="viewFullName"></p>
              </article>
              <article class="profile-info-item">
                <h3>Kullanıcı Adı</h3>
                <p id="viewUsername"></p>
              </article>
              <article class="profile-info-item">
                <h3>E-posta</h3>
                <p id="viewEmail"></p>
              </article>
              <article class="profile-info-item">
                <h3>Unvan</h3>
                <p id="viewTitle"></p>
              </article>
            </div>

            <article class="profile-info-item profile-info-item--wide">
              <h3>Biyografi</h3>
              <p id="viewBio"></p>
            </article>
          </div>

          <form id="profileForm" class="profile-form" hidden aria-describedby="profileFormFeedback">
            <div class="profile-form-grid">
              <label class="profile-field" for="firstNameInput">
                <span>Ad</span>
                <input
                  id="firstNameInput"
                  name="firstName"
                  type="text"
                  maxlength="40"
                  required
                  autocomplete="given-name"
                />
              </label>

              <label class="profile-field" for="lastNameInput">
                <span>Soyad</span>
                <input
                  id="lastNameInput"
                  name="lastName"
                  type="text"
                  maxlength="40"
                  required
                  autocomplete="family-name"
                />
              </label>

              <label class="profile-field" for="usernameInput">
                <span>Kullanıcı Adı</span>
                <input
                  id="usernameInput"
                  name="username"
                  type="text"
                  maxlength="30"
                  required
                  autocomplete="username"
                />
              </label>

              <label class="profile-field" for="emailInput">
                <span>E-posta</span>
                <input
                  id="emailInput"
                  name="email"
                  type="email"
                  maxlength="80"
                  required
                  autocomplete="email"
                />
              </label>

              <label class="profile-field" for="titleInput">
                <span>Unvan / Rol</span>
                <input
                  id="titleInput"
                  name="title"
                  type="text"
                  maxlength="60"
                  autocomplete="organization-title"
                />
              </label>

              <label class="profile-field" for="joinDateInput">
                <span>Katılım Tarihi</span>
                <input
                  id="joinDateInput"
                  name="joinDate"
                  type="date"
                  autocomplete="off"
                />
              </label>
            </div>

            <label class="profile-field" for="bioInput">
              <span>Biyografi</span>
              <textarea
                id="bioInput"
                name="bio"
                rows="5"
                maxlength="240"
                autocomplete="off"
              ></textarea>
            </label>

            <div class="profile-form-actions">
              <button class="back-button" type="submit">Değişiklikleri Kaydet</button>
              <button id="cancelEditButton" class="profile-tertiary-button" type="button">
                İptal
              </button>
            </div>
            <p id="profileFormFeedback" class="profile-feedback" aria-live="polite" role="status"></p>
          </form>
        </article>
      </section>
    </main>

    <script type="module" src="profile.js"></script>
  </body>
</html>
